[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fitpilot-ai"
version = "0.1.0"
description = "A production-oriented AI fitness planning and progress-analysis application."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]